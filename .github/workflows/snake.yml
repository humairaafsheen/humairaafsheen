
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Purple Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: humairaafsheen
          outputs: |
            dist/github-snake.svg?color_snake=%23A78BFA&color_dots=%230B1120,%23211047,%235425A8,%238B5CF6,%23D8B4FE
            dist/github-snake-dark.svg?color_snake=%23C4B5FD&color_dots=%230B1120,%23211047,%235425A8,%238B5CF6,%23D8B4FE

      - name: Publish Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
